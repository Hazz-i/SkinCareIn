services:
  postgres:
    image: postgres:16-alpine
    container_name: skinsight_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-skinsight_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skinsight_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - skinsight_network
    # Deliberately not published. Reach it with:
    #   docker compose exec postgres psql -U $POSTGRES_USER -d $POSTGRES_DB

  api1:
    build:
      context: .
      dockerfile: dockerfile
    restart: always
    env_file:
      - .env
    environment:
      # Overrides the .env value so the container always talks to the compose database.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-skinsight_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skinsight_network

  api2:
    build:
      context: .
      dockerfile: dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-skinsight_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skinsight_network

  nginx:
    image: nginx:alpine
    container_name: skinsight_load_balancer
    restart: always
    ports:
      # Host port is configurable so a TLS-terminating proxy can sit in front, e.g.
      # API_PORT=8888 docker compose up -d
      - "${API_PORT:-8888}:8888"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    networks:
      - skinsight_network

volumes:
  postgres_data:

networks:
  skinsight_network:
    driver: bridge
